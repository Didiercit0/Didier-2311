name: caracolclub

services:
  snailpay:
    build:
      context: .
      dockerfile: Dockerfile
      target: snailpay
    environment:
      SNAILPAY_PORT: "4001"
      SNAILPAY_MODE: ${SNAILPAY_MODE:-normal}
      SNAILPAY_TIMEOUT_DELAY_MS: ${SNAILPAY_TIMEOUT_DELAY_MS:-6500}
    ports:
      - "127.0.0.1:${SNAILPAY_HOST_PORT:-4001}:4001"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:8080"
    depends_on:
      snailpay:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
